exclude: ^thirdparty/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: \.clang-format$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml

  - repo: local
    hooks:
      - id: cmake-format
        name: cmake-format
        entry: cmake-format -i
        language: python
        types: [cmake]
        additional_dependencies:
          - cmakelang==0.6.13
        require_serial: true
      - id: fault-boundary
        name: fault boundary
        description: >-
          Only gqe/node_manager/fault_boundary reads the poisoned flag or the
          rank_fatal and node_fatal response fields in the node manager and the
          task manager.
        language: pygrep
        entry: '\bis_shared_memory_poisoned\s*\(|(\.|->)(set_)?(node|rank)_fatal\s*\('
        files: ^src/(node_manager|task_manager)/
        exclude: ^src/node_manager/fault_boundary\.cpp$

  - repo: https://github.com/rapidsai/pre-commit-hooks
    rev: v0.4.0
    hooks:
      - id: verify-copyright

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.4
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]
